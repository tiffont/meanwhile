<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meanwhile… — comic recaps</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111'/%3E%3Crect x='11' y='15' width='11' height='34' rx='5.5' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Crect x='26.5' y='15' width='11' height='34' rx='5.5' fill='%23c7e47f' stroke='%23c7e47f' stroke-width='3'/%3E%3Crect x='42' y='15' width='11' height='34' rx='5.5' fill='none' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E">
<meta name="theme-color" content="#111111">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="apple-mobile-web-app-title" content="Meanwhile">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap">
<style>
:root{
  --paper:#ededed; --well:#dedede; --ink:#151515; --ink2:#555; --rule:#b9b9b9; --black:#151515; --white:#f4f4f4;
  --sub:#333; --skel:#cfcfcf; --ph1:#d2d2d2; --ph2:#c8c8c8; --phink:#9a9a9a; --off:#bdbdbd; --offink:#f2f2f2; --onblack:#cfcfcf; --dim:#aaa; --hold:#8a8a8a; --foot:#151515; --edge:transparent;
  --lime:#c7e47f; --lime-ink:#18200a; --lime-text:#4f6b12;
  --display:"Archivo",system-ui,sans-serif;
  --sans:"Inter",-apple-system,system-ui,sans-serif;
  --serif:"Source Serif 4",Georgia,serif;
  color-scheme:light;
}
html[data-theme="dark"],:root:root{
  --paper:#111; --well:#1b1b1b; --ink:#ececec; --ink2:#a3a3a3; --rule:#3a3a3a; --black:#000; --white:#f1f1f1;
  --sub:#cfcfcf; --skel:#2a2a2a; --ph1:#262626; --ph2:#2e2e2e; --phink:#5a5a5a; --off:#262626; --offink:#5f5f5f; --onblack:#bdbdbd; --dim:#8a8a8a; --hold:#6f6f6f; --foot:#000; --edge:#2e2e2e; --lime-text:#c7e47f;
  color-scheme:dark;
}
.lead,.art .hero,.cliff,.pub .plate,.phead .plate{box-shadow:inset 0 0 0 1px var(--edge)}
.tools{justify-self:end;display:flex;gap:8px;align-items:center}
.theme{width:34px;height:34px;border:1.5px solid var(--ink);border-radius:999px;display:grid;place-items:center}
.theme svg{width:16px;height:16px}
.theme .sun{display:none}
html[data-theme="dark"] .theme .sun{display:block}
html[data-theme="dark"] .theme .moon{display:none}
@media (max-width:640px){.theme{width:38px;height:38px}}
.bar .theme{width:30px;height:30px}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--paper)!important}
body{margin:0;background:var(--paper)!important;color:var(--ink)!important;font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;
  padding-left:env(safe-area-inset-left,0);padding-right:env(safe-area-inset-right,0);min-height:100dvh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding:0 16px}

/* type helpers */
.disp{font-family:var(--display);font-weight:900;font-stretch:125%;text-transform:uppercase;line-height:.9;letter-spacing:-.01em}
.cond{font-family:var(--display);font-weight:800;font-stretch:75%;text-transform:uppercase;line-height:.92;letter-spacing:-.01em}
.meta{font-size:.7rem;text-transform:uppercase;letter-spacing:.02em;color:var(--ink)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 9px;border:1px solid currentColor;border-radius:999px;font-size:.66rem;font-weight:600;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.tag.solid{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.dead{opacity:.45}

/* masthead */
.mast{padding:calc(env(safe-area-inset-top,0px) + 14px) 0 14px}
.mast .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.mast .mark{justify-self:start;display:flex;gap:4px}
.mast .mark i{display:block;width:14px;height:30px;border-radius:7px;border:1.5px solid var(--ink)}
.mast .mark i:nth-child(2){background:var(--lime);border-color:var(--lime)}
.logo{font-family:var(--display);font-weight:900;font-stretch:125%;text-transform:uppercase;font-size:clamp(2.1rem,8.5vw,5.2rem);line-height:.85;letter-spacing:-.02em}
.pill{justify-self:end;display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border:1.5px solid var(--ink);border-radius:999px;font-size:.78rem;font-weight:600;text-transform:uppercase}
.pill svg{width:15px;height:15px}
@media (max-width:640px){.mast .mark{display:none}.mast .wrap{grid-template-columns:1fr auto}.pill span{display:none}.pill{width:38px;height:38px;padding:0;justify-content:center}}
.bar{position:fixed;top:0;left:0;right:0;z-index:20;background:color-mix(in srgb,var(--paper) 62%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);border-bottom:1px solid color-mix(in srgb,var(--rule) 60%,transparent);transform:translateY(-100%);transition:transform .25s;padding-top:env(safe-area-inset-top,0)}
.bar.show{transform:none}
.bar .wrap{display:flex;justify-content:space-between;align-items:center;height:50px}
.bar .logo{font-size:1.5rem}
.brandrow{display:flex;align-items:center;gap:10px}
.bar .mark{display:flex;gap:3px}
.bar .mark i{display:block;width:9px;height:20px;border-radius:5px;border:1.5px solid var(--ink)}
.bar .mark i:nth-child(2){background:var(--lime);border-color:var(--lime)}
.bar .pill{height:30px}

/* search drawer */
.searchbox{padding:6px 0 18px}
.sfield{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--ink);padding:6px 12px 6px 14px}
.sfield [data-closesearch]{display:grid;place-items:center;width:32px;height:32px;margin-right:-4px}
.sfield svg{width:22px;height:22px;flex:none}
.sfield input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-family:var(--display);font-stretch:100%;font-weight:700;font-size:1.4rem;color:var(--ink);padding:6px 0}
.sfield input:focus{outline:none}
.sfield input::placeholder{color:var(--hold)}
.hits{list-style:none;margin:0;padding:0}
.hits li{border-bottom:1px solid var(--rule)}
.hit{display:flex;align-items:center;gap:14px;width:100%;padding:12px 0}
.hit img,.hit .ph{width:42px;height:63px;object-fit:cover;flex:none}
.hit b{display:block;font-weight:700;font-size:1rem;line-height:1.2}
.hit .meta{color:var(--ink2)}
.hit .tag{margin-left:auto}
.none{padding:16px 0;color:var(--ink2)}
.none b{color:var(--ink)}
.none button{margin-top:10px}

/* home lead */
.well{background:var(--well);border-radius:16px;padding:14px;display:grid;grid-template-columns:1.85fr 1fr;gap:14px}
@media (max-width:860px){.well{grid-template-columns:1fr;padding:10px}}
.lead{position:relative;display:block;width:100%;min-height:440px;aspect-ratio:4/5;border-radius:12px;overflow:hidden;background:var(--black);color:var(--white);text-align:center}
@media (min-width:861px){.lead{aspect-ratio:auto;min-height:520px;height:100%}}
.lead .img{position:absolute;inset:0;background:var(--skel)}
.lead .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.lead:hover .img img{transform:scale(1.03)}
.lead .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.55) 55%,rgba(0,0,0,.92) 100%)}
.lead .txt{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 18px 20px}
.lead .tag{color:var(--lime-ink);background:var(--lime);border-color:var(--lime)}
.lead h1{font-family:var(--display);font-stretch:100%;font-weight:800;font-size:clamp(1.9rem,4.6vw,3rem);line-height:1.04;margin:0;max-width:18ch;letter-spacing:-.025em;text-shadow:0 2px 18px rgba(0,0,0,.5)}
.lead p{margin:0;max-width:44ch;font-size:.92rem;color:#e2e2e2}
.lead .meta{color:#cfcfcf}
.side{display:flex;flex-direction:column;padding:4px 6px}
.side h2{display:flex;align-items:center;gap:10px;margin:6px 0 10px;font-size:clamp(1.8rem,3.2vw,2.2rem)}
.side h2 .arrows{display:flex;flex-direction:column;gap:1px}
.side h2 .arrows i{display:block;width:16px;height:9px;border:3px solid var(--lime-text);border-top:0;border-left:0;transform:rotate(45deg) translate(-2px,-2px);width:12px;height:12px}
.side ul{list-style:none;margin:0;padding:0}
.side li{border-top:1px solid var(--ink)}
.side li button,.side li .x{display:block;width:100%;padding:12px 0 14px}
.side li b{display:block;font-weight:700;font-size:1.02rem;line-height:1.22;margin-top:4px}

/* sections */
.sec{padding:44px 0 8px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:10px;margin-bottom:0}
.shead h2{margin:0;font-size:clamp(2.2rem,9vw,4.2rem);white-space:nowrap}
.shead .meta{padding-bottom:6px;white-space:nowrap}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  width:calc(100% - 32px);max-width:1148px;margin:0 auto;padding:16px 0 8px;scroll-padding-inline:0}
.rail::-webkit-scrollbar{display:none}
.card{flex:none;width:200px;scroll-snap-align:start;display:flex;flex-direction:column;gap:10px;padding:10px 10px 16px;background:var(--well);border-radius:14px;box-shadow:inset 0 0 0 1px var(--edge);transition:transform .15s}
.card:active{transform:scale(.98)}
.card .img{width:100%;aspect-ratio:2/3;background:var(--skel);overflow:hidden;position:relative;border-radius:8px}
.card .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
video.hv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 0;opacity:0;transition:opacity .25s;pointer-events:none;display:block}
video.hv.on{opacity:1}
.card .tag,.card b,.card .meta{margin-inline:4px}
.card b{font-weight:700;font-size:1.08rem;line-height:1.18}
.card .meta{color:var(--ink2)}
.ph{background:repeating-linear-gradient(135deg,var(--ph1) 0 8px,var(--ph2) 8px 16px);display:grid;place-items:center}
.ph span{font-family:var(--display);font-weight:900;font-stretch:125%;font-size:1.4rem;color:var(--phink)}
.pub{flex:none;width:200px;scroll-snap-align:start;display:flex;flex-direction:column;gap:10px;padding:10px 10px 14px;background:var(--well);border-radius:14px;box-shadow:inset 0 0 0 1px var(--edge)}
.pub .meta{margin-inline:4px}
.pub .plate{height:120px;border-radius:10px;background:var(--black);color:#fff;display:grid;place-items:center;padding:0 12px;text-align:center;font-size:1.25rem}
.pub[disabled]{cursor:default}
.pub[disabled] .plate{background:var(--off);color:var(--offink)}

/* series + publisher pages */
.crumb{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:15;display:inline-flex;align-items:center;gap:10px;margin:4px 0 6px;padding:9px 18px 9px 10px;border-radius:999px;
  font-family:var(--display);font-stretch:110%;font-weight:800;font-size:.95rem;text-transform:uppercase;letter-spacing:.01em;color:var(--ink);
  background:color-mix(in srgb,var(--well) 55%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 6px 20px rgba(0,0,0,.35);transition:transform .15s,box-shadow .15s}
.crumb svg{width:26px;height:26px;padding:5px;border-radius:50%;background:var(--lime);color:var(--lime-ink);flex:none}
.crumb:hover{box-shadow:inset 0 0 0 1px var(--lime),0 6px 20px rgba(0,0,0,.35)}
.crumb:active{transform:scale(.97)}
.phead{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:end;padding:14px 0 22px;border-bottom:1px solid var(--ink)}
.phead .cov{width:120px;aspect-ratio:2/3;overflow:hidden;position:relative;background:var(--skel)}
.phead .cov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.phead>div{min-width:0}
.phead h1{margin:8px 0 8px;font-size:clamp(2rem,7.4vw,4.4rem);overflow-wrap:anywhere}
.phead p{margin:0;color:var(--ink2);font-size:.9rem}
.phead .plate{width:120px;height:90px;border-radius:10px;background:var(--black);color:#fff;display:grid;place-items:center;font-size:1.1rem;padding:0 8px;text-align:center}
.prog{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--rule)}
.prog .track{flex:1;height:4px;background:var(--skel)}
.prog .track i{display:block;height:100%;background:var(--ink)}
.rows{list-style:none;margin:0;padding:0}
.rows li{border-bottom:1px solid var(--rule)}
.row{display:grid;grid-template-columns:minmax(64px,auto) 1fr auto;gap:18px;align-items:center;width:100%;padding:14px 0}
.row[disabled]{cursor:default}
.row .no{font-size:2rem}
.row b{display:block;font-weight:700;font-size:1.05rem;line-height:1.2}
.row .meta{color:var(--ink2);margin-top:3px}

.crumbwrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:15;height:0}
.crumbwrap .crumb{position:relative;top:14px}
.pubhero{position:relative;overflow:hidden;width:100%;min-height:300px;margin:0 0 18px;display:flex;align-items:flex-end;background:var(--well)}
.pubhero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 25%;filter:saturate(.9)}
.pubhero .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.82) 0%,rgba(0,0,0,.5) 55%,rgba(0,0,0,.2) 100%),linear-gradient(0deg,rgba(17,17,17,1) 0%,rgba(0,0,0,.35) 45%,rgba(0,0,0,.45) 100%)}
.pubhero .txt{position:relative;padding-top:90px;padding-bottom:26px}
.pubhero .eyebrow2{display:block;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#e8e8e8;margin-bottom:4px}
.pubhero h1{margin:0;color:#fff;font-size:clamp(3rem,13vw,6.5rem);line-height:.88}
.pubhero p{margin:10px 0 0;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;color:var(--lime)}
@media (min-width:700px){.pubhero{min-height:380px}}
.thumb{width:64px;aspect-ratio:2/3;position:relative;overflow:hidden;border-radius:6px;background:var(--skel);flex:none}
.thumb.sm{width:42px}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block}
.row .go{display:grid;place-items:center;width:44px;color:var(--ink2);transition:color .15s,transform .2s}
.row .go svg{width:40px;height:16px}
.row:hover .go{color:var(--lime);transform:translateX(4px)}
.seeall{display:inline-flex;align-items:center;gap:8px;padding-bottom:6px;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--ink);white-space:nowrap}
.seeall span{color:var(--ink2);font-weight:500}
.seeall svg{width:30px;height:12px;color:var(--lime-text);transition:transform .2s}
.seeall:hover svg{transform:translateX(4px)}
.lhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:1px solid var(--ink);padding:10px 0 10px;margin-bottom:18px}
.lhead h1{margin:0;font-size:clamp(2.8rem,11vw,5rem)}
.lhead .meta{padding-bottom:8px;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;padding-bottom:20px}
.grid .card,.grid .pub{width:auto}
@media (min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}}
.pub .plate{display:flex!important;align-items:center;justify-content:center}
.pub .plate img{max-width:62%;max-height:70%;width:auto;height:auto;object-fit:contain;display:block;margin:auto}
.pub{text-align:left}
.pname{font-weight:700;font-size:1.05rem;margin:0 4px -4px}
.pub .meta::before{content:none}
.spoil-note{color:var(--lime);font-weight:600}

.sharefoot{margin:26px 0 10px}
.sharefoot .share{justify-content:center}
.tag.na{color:var(--ink2);border-color:#555}
.row.dead,.hit.dead{opacity:.45}
.sheet .row.dim{opacity:.45}
.sheet .row.dim[aria-pressed="true"]{opacity:.75}
.sheet .rows{max-height:52dvh;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none}
.sheet .rows::-webkit-scrollbar{display:none}
.sheet .box{overflow-x:hidden;scrollbar-width:none}
.sheet .box::-webkit-scrollbar{display:none}
.row .go{overflow:hidden}
.sheet .row.here b{color:var(--ink)}
.tag.reading{color:#fff;border-color:#fff;background:transparent}
a.tag.link{text-decoration:none;transition:background .15s,color .15s,border-color .15s}
a.tag.link:hover{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}

/* featured (single) */
.feat{display:grid;grid-template-columns:minmax(0,360px) 1fr;gap:40px;align-items:center;width:100%;background:var(--well);border-radius:16px;padding:16px;box-shadow:inset 0 0 0 1px var(--edge);text-align:left}
.feat .fimg{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--skel)}
.feat .fimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.feat:hover .fimg img{transform:scale(1.03)}
.feat .ftxt{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:8px 16px 8px 0}
.feat .ftxt .meta{color:var(--ink2)}
.feat h1{font-family:var(--display);font-stretch:100%;font-weight:800;font-size:clamp(2.2rem,5vw,3.8rem);line-height:1.02;margin:0;letter-spacing:-.025em}
.feat p{margin:0;font-size:1.15rem;line-height:1.5;color:var(--sub);max-width:60ch}
.feat .ftxt{width:100%}
.fdl{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:28px;margin:6px 0 0;padding:14px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);width:100%}
.fdl dt{font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin-bottom:3px}
.fdl dd{margin:0;font-size:.9rem;font-weight:600}
.fthings{width:100%}
.fthings .eyebrow{display:block;margin-bottom:8px;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
.fthings ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fthings li{display:flex;gap:10px;align-items:baseline;background:var(--paper);border-radius:10px;padding:12px}
.fthings li b{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:1.4rem;line-height:1;color:var(--lime-text)}
.fthings li span{font-size:.88rem;font-weight:600;line-height:1.3}
@media (max-width:900px){.fthings ol{grid-template-columns:1fr}.fdl{gap:18px}}
.feat .fgo{display:inline-flex;align-items:center;gap:12px;margin-top:8px;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.feat .fgo svg{width:40px;height:16px;color:var(--lime-text);transition:transform .2s}
.feat:hover .fgo svg{transform:translateX(5px)}
@media (max-width:700px){.feat{grid-template-columns:1fr;gap:18px;padding:12px}.feat .fimg{aspect-ratio:4/5}.feat .ftxt{padding:0 6px 8px}}

/* legal + footer */
.fgrid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px 48px;align-items:end}
.fabout{font-size:.9rem;line-height:1.6;color:#a8a8a8;margin:12px 0 0!important;max-width:52ch}
.fabout .spoil-note{font-weight:700}
.flinks{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px 22px;max-width:none}
.flinks a,.flinks button{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:#7a7a7a;padding:0;text-align:left;white-space:nowrap}
.flinks a:hover,.flinks button:hover{color:var(--lime)}
.fcopy{grid-column:1/-1;max-width:none!important;font-size:.72rem;color:#6f6f6f;margin:0!important;padding-top:16px;border-top:1px solid #222}

/* ---------- data (loaded from Supabase) ---------- */
const SB_URL = "https://crlbkiodcguweckdmexc.supabase.co";
const SB_KEY = "sb_publishable_L10DVFZwuiE3fd9puJ0Eqw_kjpTqua-";
let SERIES = [], PUBLISHERS = [];
async function sbFetch(path, opts={}){
  const r = await fetch(`${SB_URL}/rest/v1/${path}`, { ...opts, headers:{ apikey:SB_KEY, Authorization:`Bearer ${SB_KEY}`, "Content-Type":"application/json", ...(opts.headers||{}) } });
  if(!r.ok) throw new Error(await r.text());
  return r.status===201||r.status===204 ? null : r.json();
}
async function loadData(){
  const [pubs, series, issues] = await Promise.all([
    sbFetch("publishers?select=*&order=name"),
    sbFetch("series?select=*"),
    sbFetch("issues?select=*&status=eq.published&order=published_at.asc")
  ]);
  PUBLISHERS = pubs.map(p=>({ id:p.id, name:p.name, logo:p.logo_url }));
  const pname = Object.fromEntries(PUBLISHERS.map(p=>[p.id,p.name]));
  const byS = {};
  VIDEOS = Object.fromEntries(issues.filter(i=>i.video_url&&i.cover_url).map(i=>[i.cover_url,i.video_url]));
  issues.forEach(i=>{ (byS[i.series_id] ||= []).push({
    n:i.number, title:i.title||"", cover:i.cover_url, publishedAt:i.published_at, views:+i.views||0,
    recap:{ deck:i.deck, standard:i.paragraphs, cast:i.cast_list.map(c=>[c.name,c.role]), things:i.things.map(t=>({b:t.title,s:t.text})), cliff:i.cliffhanger }
  }); });
  // order series by their most recent published issue so "Latest" stays newest-last in allIssues()
  SERIES = series.map(s=>({ id:s.id, title:s.title, year:s.year, publisher:pname[s.publisher_id]||s.publisher_id, publisherId:s.publisher_id,
      creators:s.writer||"", art:s.artist||"", last:s.last_issue||undefined, issues:(byS[s.id]||[]).sort((a,b)=>a.n-b.n) }))
    .filter(s=>s.issues.length)
    .sort((a,b)=>Math.max(...a.issues.map(i=>+new Date(i.publishedAt)))-Math.max(...b.issues.map(i=>+new Date(i.publishedAt))));
}
const seriesBy = id=>SERIES.filter(s=>s.publisherId===id);
const activePubs = ()=>PUBLISHERS.filter(pb=>seriesBy(pb.id).length);
const recapCount = id=>seriesBy(id).reduce((a,s)=>a+s.issues.filter(i=>i.recap).length,0);

document.addEventListener("pointerover",e=>{
  if(e.pointerType!=="mouse") return;
  const host=e.target.closest("button,a"); if(!host) return;
  const im=host.querySelector("img[data-video]"); if(!im) return;
  let v=im.parentElement.querySelector("video.hv");
  if(!v){ v=document.createElement("video"); v.className="hv"; v.muted=true; v.loop=true; v.playsInline=true; v.preload="auto"; v.src=im.dataset.video;
    v.addEventListener("playing",()=>{ if(v._want) v.classList.add("on"); }); im.after(v); }
  v._want=true; v.play().catch(()=>{});
});
document.addEventListener("pointerout",e=>{
  const host=e.target.closest("button,a"); if(!host || host.contains(e.relatedTarget)) return;
  const v=host.querySelector("video.hv"); if(!v) return;
  v._want=false; v.classList.remove("on"); v.pause();
});

const CHEV=d=>`<svg viewBox="0 0 16 16" aria-hidden="true"><path d="${d<0?"M10 3 5 8l5 5":"M6 3l5 5-5 5"}" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>`;
function railOf(el){ const sec=el.closest("section"); return sec&&sec.querySelector(".rail"); }
function syncRail(r){ const nav=r._nav; if(!nav) return; const max=r.scrollWidth-r.clientWidth;
  nav.classList.toggle("on", max>4); nav.children[0].disabled=r.scrollLeft<=4; nav.children[1].disabled=r.scrollLeft>=max-4; }
function enhanceRails(){ app.querySelectorAll("section .shead").forEach(h=>{ const r=railOf(h); if(!r||r._nav) return;
  const nav=document.createElement("div"); nav.className="rnav";
  nav.innerHTML=`<button class="rbtn" data-dir="-1" aria-label="Scroll left">${CHEV(-1)}</button><button class="rbtn" data-dir="1" aria-label="Scroll right">${CHEV(1)}</button>`;
  const see=h.querySelector(".seeall"); h.insertBefore(nav, see||null); r._nav=nav;
  r.addEventListener("scroll",()=>syncRail(r),{passive:true}); syncRail(r); }); }
document.addEventListener("click",e=>{ const b=e.target.closest(".rbtn"); if(!b) return; const r=railOf(b); if(!r) return;
  e.preventDefault(); e.stopPropagation(); r.scrollBy({left:+b.dataset.dir*Math.max(220,r.clientWidth*0.85),behavior:"smooth"}); },true);
new MutationObserver(()=>enhanceRails()).observe(app,{childList:true});
window.addEventListener("resize",()=>app.querySelectorAll(".rail").forEach(syncRail));

          <div><dt>Writing</dt><dd>${esc(s.creators)}</dd></div>
          <div><dt>Art</dt><dd>${esc(s.art)}</dd></div>
        </dl>
        <div class="hcast"><dt class="hlab">Characters</dt><div class="cast">${r.cast.map(c=>`<span class="tag">${c[0]}<em>${c[1]}</em></span>`).join("")}</div></div>
      </div></div>
    <div class="body">${r.standard.map(p=>`<p>${p}</p>`).join("")}</div>
    ${ads.slot("recap-mid")}
    <h2 class="h2 cond">Three things to remember</h2>
    <ol class="nums">${r.things.map((t,k)=>`<li><span class="n disp">${k+1}</span><div><b>${t.b}</b><span>${t.s}</span></div></li>`).join("")}</ol>
    <div class="cliff"><span class="tag">Where we left off</span><p>${r.cliff}</p></div>
    <div class="actions">
      ${issueRows(s).length>1?`<button class="btn solid" data-catch>Missed more? Catch me up</button>`:""}
    </div>
    ${shareBar(key(s,i.n), `Catch up on ${s.title} #${i.n} in 45 seconds`, "Know someone reading this?")}
    ${ads.slot("recap-end")}
  </article></div>`;
  app.dataset.cur = key(s,i.n);
}

function closeSheet(el){
  if(el.classList.contains("closing")) return;
  el.classList.add("closing");
  const done=()=>el.remove();
  el.querySelector(".box").addEventListener("animationend",done,{once:true});
  setTimeout(done,400);
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ const sh=document.querySelector(".sheet"); if(sh) closeSheet(sh); } });
function catchSheet(s,i){
  const el = document.createElement("div");
  el.className="sheet";
  el.innerHTML = `<div class="box" role="dialog" aria-modal="true" aria-label="Catch me up"><div class="grabzone" aria-hidden="true"><div class="grab"></div></div><h3 class="cond">Catch me up</h3><p>Every issue of ${esc(s.title)}. Tap any available recap to read it.</p>
    <ul class="rows">${issueRows(s).map(x=>{
      if(x.range) return `<li><div class="row dim"><span class="no disp">#${x.range[0]}–${x.range[1]}</span><div><b>Issues #${x.range[0]}–#${x.range[1]}</b></div><span class="tag na">Unavailable</span></div></li>`;
      if(!x.recap) return `<li><div class="row dim"><span class="no disp">#${x.n}</span><div><b>${x.missing?`Issue #${x.n}`:esc(issueTitle(s,x))}</b></div><span class="tag na">Unavailable</span></div></li>`;
      if(x.n===i.n) return `<li><div class="row here" aria-current="page"><span class="no disp">#${x.n}</span><div><b>${x.missing?`Issue #${x.n}`:esc(issueTitle(s,x))}</b></div><span class="tag reading">Reading</span></div></li>`;
      return `<li><button class="row" data-href="${key(s,x.n)}"><span class="no disp">#${x.n}</span><div><b>${x.missing?`Issue #${x.n}`:esc(issueTitle(s,x))}</b></div><span class="go" aria-hidden="true"><svg viewBox="0 0 40 16"><path d="M1 8h36M30 2l7 6-7 6" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="butt" stroke-linejoin="miter"/></svg></span></button></li>`;
    }).join("")}</ul>
    <button class="btn solid" style="width:100%;margin-top:14px" data-close>Done</button></div>`;
  document.body.appendChild(el);
  document.body.style.overflow="hidden";
  (()=>{ const box=el.querySelector(".box"), zone=el.querySelector(".grabzone"); if(!zone) return;
    let y0=null,t0=0,dy=0;
    zone.addEventListener("pointerdown",e=>{ y0=e.clientY; t0=performance.now(); dy=0; box.classList.remove("snap"); box.classList.add("dragging"); zone.setPointerCapture(e.pointerId); });
    zone.addEventListener("pointermove",e=>{ if(y0===null) return; dy=Math.max(0,e.clientY-y0); box.style.transform=`translateY(${dy}px)`; el.style.background=`rgba(21,21,21,${.55*Math.max(0,1-dy/box.offsetHeight)})`; });
    const end=()=>{ if(y0===null) return; const v=dy/Math.max(1,performance.now()-t0); y0=null; box.classList.remove("dragging");
      if(dy>box.offsetHeight*0.28 || v>0.6){ box.classList.add("snap"); box.style.transform="translateY(105%)"; el.style.transition="background .25s"; el.style.background="rgba(21,21,21,0)"; setTimeout(()=>el.remove(),260); }
      else { box.classList.add("snap"); box.style.transform=""; el.style.background=""; } };
    zone.addEventListener("pointerup",end); zone.addEventListener("pointercancel",end);
  })();
  new MutationObserver((m,o)=>{ if(!document.body.contains(el)){ document.body.style.overflow=""; o.disconnect(); } }).observe(document.body,{childList:true});
  el.addEventListener("click", e=>{
    const b = e.target.closest("button");
    if(e.target===el || (b && b.hasAttribute("data-close"))){ closeSheet(el); return; }
    if(b && b.dataset.from){
      el.querySelectorAll("[data-from]").forEach(x=>x.setAttribute("aria-pressed", x===b));
      const n=+b.dataset.from; const lacking=[]; for(let k=n;k<=i.n;k++){ const f=s.issues.find(x=>x.n===k); if(!f||!f.recap) lacking.push(k); } const missing = lacking.length>3 ? ["#"+lacking[0]+"–#"+lacking[lacking.length-1]] : lacking.map(k=>"#"+k);
      el.querySelector("[data-msg]").textContent = n===i.n ? `Just issue #${i.n}: that's the recap on this page.` :
        missing.length ? `Recaps for ${missing.join(", ")} aren't written yet, so for now only #${i.n} is available.` : `You'll get #${n}–#${i.n} in one recap.`;
    }
  });
}

/* ---------- search ---------- */
const sb = document.getElementById("searchbox"), q = document.getElementById("q"), hits = document.getElementById("hits");
function openSearch(){ sb.hidden=false; window.scrollTo({top:0}); q.focus(); }
function closeSearch(){ sb.hidden=true; q.value=""; hits.innerHTML=""; }
function search(v){
  const t = v.trim().toLowerCase();
  if(!t){ hits.innerHTML=""; return; }
  const num = (t.match(/#?\s*(\d+)\s*$/)||[])[1];
  const words = t.replace(/#?\s*\d+\s*$/,"").trim();
  const found = allIssues().filter(({s,i})=>i.recap).filter(({s,i})=>{
    const name = s.title.toLowerCase();
    const okName = !words || name.includes(words) || words.split(/\s+/).every(w=>name.includes(w)) || (i.title||"").toLowerCase().includes(words);
    return okName && (!num || +num===i.n);
  });
  hits.innerHTML = found.length ? found.slice(0,6).map(({s,i})=>`<li><button class="hit ${i.recap?"":"dead"}" ${i.recap?`data-href="${key(s,i.n)}"`:`data-href="${s.id}"`}><div class="thumb sm">${img(i.cover,i.n)}</div><div><span class="meta">${esc(s.publisher)}</span><b>${esc(s.title)} #${i.n}</b></div>${i.recap?"":`<span class="tag na">Unavailable</span>`}</button></li>`).join("") :
    `<li class="none"><b>No recaps for "${esc(v)}" yet.</b><br>The library is just getting started.<br><button class="btn" style="height:40px;padding:0 16px;display:inline-flex" data-request="${esc(v)}">Ask for this one</button></li>`;
}
q.addEventListener("input", ()=>search(q.value));
let sTimer; q.addEventListener("input", ()=>{ clearTimeout(sTimer); sTimer=setTimeout(()=>{ if(q.value.trim().length>1) analytics.event("search",{ search_term:q.value.trim() }); },1200); });

function legalView(id){

/* ---------- routing ---------- */
function route(){
  document.querySelectorAll(".sheet").forEach(x=>x.remove());
  const h = location.hash.slice(1) || "home";
  const pb = PUBLISHERS.find(x=>x.id===h), s = findSeries(h);
  if(LEGAL[h]) legalView(h);
  else if(LISTS[h]) listView(h);
  else if(pb && seriesBy(pb.id).length) publisherView(pb);
  else if(s) seriesView(s);
  else {
    const m = h.match(/^(.*)-(\d+)$/), ss = m && findSeries(m[1]), ii = ss && ss.issues.find(x=>x.n===+m[2]);
    if(ii && ii.recap){ recapView(ss,ii); bumpView(key(ss,ii.n)); }
    else if(ii) seriesView(ss);
    else home();
  }
  window.scrollTo(0,0);
  ads.fill(app);
  analytics.page(document.querySelector("#app h1")?.textContent || "Home");
  const cur=location.hash.slice(1); const mm=cur.match(/^(.*)-(\d+)$/);
  if(mm && findSeries(mm[1])) analytics.event("recap_view",{ series:findSeries(mm[1]).title, issue:+mm[2] });
}
window.addEventListener("hashchange", route);

document.addEventListener("click", e=>{
  const sh = e.target.closest("[data-share]");
  if(sh){ analytics.event("share",{ method:sh.dataset.share, content: location.hash.slice(1)||"home" });
    if(sh.dataset.copy){ e.preventDefault();
      const done=()=>toast("Link copied");
      try{ navigator.clipboard.writeText(sh.dataset.copy).then(done,()=>fallbackCopy(sh.dataset.copy)); }catch(err){ fallbackCopy(sh.dataset.copy); }
      return; }
    return; }
  const ac = e.target.closest("[data-adclick]"); if(ac){ analytics.event("ad_click",{ slot:ac.dataset.adclick, type:"house" }); }
  if(e.target.closest("[data-cookieprefs]")){ store.set("consent", null); document.getElementById("consent")?.remove();
    if(needsBanner()) showConsent(); else toast("No tracking is set up yet"); return; }
  const cb = e.target.closest("[data-consent]");
  if(cb){ consent.set(cb.dataset.consent); document.getElementById("consent")?.remove(); if(canTrack()){ startTracking(); analytics.page(document.querySelector("#app h1")?.textContent||"Home"); } return; }
  const t = e.target.closest("button"); if(!t) return;
  if(t.hasAttribute("data-search")){ sb.hidden ? openSearch() : closeSearch(); return; }
  if(t.hasAttribute("data-closesearch")){ closeSearch(); return; }
  if(t.dataset.href){ go(t.dataset.href); return; }
  if(t.dataset.request!==undefined){ sbFetch("requests",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({query:t.dataset.request.slice(0,200)})}).catch(()=>{}); toast("Noted — added to the list"); return; }
  if(!app.contains(t)) return;
  const cur = app.dataset.cur && app.dataset.cur.match(/^(.*)-(\d+)$/);
  const s = cur && findSeries(cur[1]), i = s && s.issues.find(x=>x.n===+cur[2]);
  if(t.hasAttribute("data-markread")){
    const k=key(s,i.n);
    if(readSet.has(k)){ readSet.delete(k); toast("Marked as unread"); }
    else { s.issues.forEach(x=>{ if(x.n<=i.n) readSet.add(key(s,x.n)); }); toast(`Enjoy #${i.n+1}`); }
    saveRead(); recapView(s,i); return;
  }
  if(t.hasAttribute("data-catch")){ analytics.event("catch_me_up_open",{ series:s.title, issue:i.n }); catchSheet(s,i); return; }
  if(t.dataset.fb){ sbFetch("feedback",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({issue_id:key(s,i.n),accurate:t.dataset.fb==="y"})}).catch(()=>{}); app.querySelectorAll("[data-fb]").forEach(b=>b.classList.toggle("on",b===t)); toast(t.dataset.fb==="y"?"Thanks!":"Thanks — we'll check it"); return; }
});
